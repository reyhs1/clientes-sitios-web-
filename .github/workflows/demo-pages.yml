name: Validate and deploy the demo

on:
  push:
    branches: [main]
    paths:
      - 'sonrie-contigo-demo/**'
      - '.github/workflows/demo-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sonrie-contigo-demo
    steps:
      - name: Check out the selected revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: sonrie-contigo-demo/package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Check types
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test scheduling and calendar exports
        run: npm test
      - name: Install the browser required by CI
        run: npx playwright install --with-deps chromium
      - name: Exercise the booking and reception flows
        run: npm run test:e2e
        env:
          PLAYWRIGHT_USE_BUNDLED_CHROMIUM: 'true'
      - name: Build for this repository's Pages path
        run: npm run build -- --base="$PAGES_BASE"
        env:
          PAGES_BASE: /${{ github.event.repository.name }}/
      - name: Upload only the compiled site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: sonrie-contigo-demo/dist

  deploy:
    needs: validate-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Read the repository's enabled Pages configuration
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Deploy the validated site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
